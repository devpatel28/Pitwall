services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pitwall
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-pitwall-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitwall -d pitwall"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: "1"
      SECRET_KEY: ${SECRET_KEY:-local-compose-development-only}
      POSTGRES_HOST: db
      POSTGRES_DB: pitwall
      POSTGRES_USER: pitwall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-pitwall-password}
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "python manage.py migrate --noinput &&
      python manage.py seed_demo &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
volumes:
  postgres_data:
